<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add challenge | Giladsa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="#">GILADSA</a>
      <ul class="nav-links">
        <li><a href="#">Dashboard</a></li>
        <li><a href="list.html" aria-current="page">Challenges</a></li>
        <li><a href="#">Levels</a></li>
        <li><a href="#">Students</a></li>
        <li><a href="#">Rewards</a></li>
      </ul>
      <span class="nav-user">Instructor &middot; <a href="#">Log out</a></span>
    </nav>
  </header>

  <main id="main" class="container">
    <p class="breadcrumb"><a href="list.html">Challenges</a> &gt; Add challenge</p>
    <div class="page-head">
      <div>
        <h1>Add challenge</h1>
        <p><span class="req">*</span> = required field</p>
      </div>
    </div>

    <!-- Create form for table CHALLENGE. Every name matches the column name exactly. -->
    <form class="card form-card" action="#" method="post">

      <div class="field">
        <label for="Level_ID">Level <span class="req" aria-hidden="true">*</span></label>
        <select id="Level_ID" name="Level_ID" required>
          <option value="">Choose a level</option>
          <option value="1">L1: Intro to stacks</option>
          <option value="2">L2: Searching arrays</option>
          <option value="3">L3: Sorting basics</option>
          <option value="4">L4: Linked list intro</option>
        </select>
        <span class="hint">Saved as challenge.Level_ID (shows game_level.Level_Title).</span>
      </div>

      <div class="field">
        <label for="Challenge_Title">Title <span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="Challenge_Title" name="Challenge_Title" maxlength="30" required placeholder="e.g. Find the target">
        <span class="hint">1 to 30 characters.</span>
        <!-- Example of an error message (shown by the server later):
        <p class="error-message" role="alert">! Title is required. Enter 1 to 30 characters.</p> -->
      </div>

      <div class="field">
        <label for="Challenge_Type">Type <span class="req" aria-hidden="true">*</span></label>
        <select id="Challenge_Type" name="Challenge_Type" required>
          <option value="">Choose a type</option>
          <option value="Puzzle">Puzzle</option>
          <option value="Coding">Coding</option>
          <option value="Quiz">Quiz</option>
        </select>
      </div>

      <div class="field">
        <label for="Max_Points">Max points <span class="req" aria-hidden="true">*</span></label>
        <input type="number" id="Max_Points" name="Max_Points" min="0" step="1" value="100" required>
      </div>

      <div class="field">
        <label for="Instructions">Instructions</label>
        <textarea id="Instructions" name="Instructions" placeholder="Explain what the student must do..."></textarea>
        <span class="hint">Optional.</span>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn" href="list.html">Cancel</a>
      </div>
    </form>
  </main>
</body>
</html>
